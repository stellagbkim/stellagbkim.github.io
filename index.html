<!DOCTYPE html>
<html lang="ko"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STAR GALAXY - 아케이드 슈팅 게임</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05050f;color:#fff;font-family:"Courier New",monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  canvas{background:#000;border:2px solid #1c2350;box-shadow:0 0 30px rgba(60,100,255,.25);image-rendering:pixelated;display:block}
  #touch{display:none;width:100%;max-width:480px;padding:0 10px;gap:10px;justify-content:space-between}
  #touch button{flex:1;height:64px;font:bold 22px "Courier New",monospace;color:#cfe;background:#10163a;border:2px solid #3a4aa8;border-radius:12px;touch-action:none}
  #touch button:active{background:#2a3a99}
  #touch #fire{flex:1.6;border-color:#c44;color:#fcc;background:#2a1018}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="640"></canvas>
  <div id="touch">
    <button id="bl">◀</button>
    <button id="fire">FIRE</button>
    <button id="br">▶</button>
  </div>
</div>

<script>
(() => {
"use strict";
const W = 480, H = 640;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

/* ---------- 화면 크기 맞춤 ---------- */
function fit(){
  const th = document.getElementById("touch").offsetHeight || 0;
  const s = Math.min(innerWidth / W, (innerHeight - th - 16) / H);
  cv.style.width = Math.floor(W * s) + "px";
  cv.style.height = Math.floor(H * s) + "px";
}
addEventListener("resize", fit); fit();

/* ---------- 스프라이트(문자 픽셀맵) ---------- */
const PAL = {W:"#ffffff",R:"#ff3b3b",B:"#3a9bff",Y:"#ffd92a",G:"#35d46a",P:"#ee55ee",C:"#4eeeff"};
const SPR = {
  player:[
    "....W....",
    "....W....",
    "...WWW...",
    ".R.WBW.R.",
    ".RWWWWWR.",
    "RRWWWWWRR",
    "RWWRWRWWR",
    "W.WWWWW.W",
    "..R...R.."],
  bee:[
    "..Y.....Y..",
    "...Y...Y...",
    "..YYYYYYY..",
    ".YY.YYY.YY.",
    "YYBYYYYYBYY",
    "Y.YYYYYYY.Y",
    "Y.Y.....Y.Y",
    "...YY.YY..."],
  butterfly:[
    "B...B.B...B",
    "BB..BBB..BB",
    "BBBRBBBRBBB",
    "BBBBBBBBBBB",
    ".BBBRRRBBB.",
    "..BB.R.BB..",
    "...B...B...",
    "...B...B..."],
  boss:[
    "..G.....G..",
    "..GG...GG..",
    ".GGGGGGGGG.",
    "GGWGGGGGWGG",
    "GGGGGGGGGGG",
    ".GGGGGGGGG.",
    "..GG...GG..",
    ".G.......G.",
    "G.........G"]
};
function sprite(map, cx, cy, s, over){
  const h = map.length, w = map[0].length;
  const x0 = Math.round(cx - w*s/2), y0 = Math.round(cy - h*s/2);
  for(let r=0;r<h;r++) for(let c=0;c<w;c++){
    const ch = map[r][c]; if(ch === ".") continue;
    ctx.fillStyle = (over && over[ch]) || PAL[ch];
    ctx.fillRect(x0 + c*s, y0 + r*s, s, s);
  }
}
function txt(str, x, y, size, color, align){
  ctx.font = "bold " + size + "px 'Courier New',monospace";
  ctx.textAlign = align || "left";
  ctx.fillStyle = color || "#fff";
  ctx.fillText(str, x, y);
}

/* ---------- 사운드 ---------- */
let ac = null, muted = false;
function beep(f, d, type, vol, slide){
  if(!ac || muted) return;
  try{
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  }catch(e){}
}
const sfx = {
  shoot: () => beep(900, 0.09, "square", 0.035, -600),
  hit:   () => beep(300, 0.08, "square", 0.05, -120),
  boom:  () => { beep(220, 0.35, "sawtooth", 0.07, -190); beep(120, 0.4, "square", 0.05, -90); },
  die:   () => { beep(400, 0.8, "sawtooth", 0.08, -360); },
  life:  () => { beep(660, 0.1, "square", 0.05); setTimeout(()=>beep(880,0.1,"square",0.05),110); setTimeout(()=>beep(1320,0.2,"square",0.05),220); },
  start: () => { [440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,0.12,"square",0.05),i*110)); }
};

/* ---------- 상태 ---------- */
let state = "title";        // title | play | over
let paused = false;
let score = 0, hi = 0, lives = 3, stage = 1, time = 0;
let nextLife = 20000;
let player, pb = [], eb = [], enemies = [], parts = [];
let diveTimer = 0, banner = 0, bannerText = "", cleared = false, stageWait = 0, overTimer = 0;
try{ hi = +localStorage.getItem("starGalaxyHi") || 0; }catch(e){}

const stars = [];
for(let i=0;i<90;i++) stars.push({x:Math.random()*W, y:Math.random()*H, s:0.4+Math.random()*1.6, z:Math.random()});

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);

/* ---------- 입력 ---------- */
const keys = {left:false, right:false, fire:false};
addEventListener("keydown", e => {
  const k = e.key;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(k)) e.preventDefault();
  if(k==="ArrowLeft"||k==="a"||k==="A") keys.left = true;
  if(k==="ArrowRight"||k==="d"||k==="D") keys.right = true;
  if(k===" "||k==="z"||k==="Z"||k==="ArrowUp"){
    keys.fire = true;
    if(state!=="play") tryStart();
  }
  if(k==="Enter" && state!=="play") tryStart();
  if((k==="p"||k==="P") && state==="play") paused = !paused;
  if(k==="m"||k==="M") muted = !muted;
});
addEventListener("keyup", e => {
  const k = e.key;
  if(k==="ArrowLeft"||k==="a"||k==="A") keys.left = false;
  if(k==="ArrowRight"||k==="d"||k==="D") keys.right = false;
  if(k===" "||k==="z"||k==="Z"||k==="ArrowUp") keys.fire = false;
});
addEventListener("blur", () => { keys.left = keys.right = keys.fire = false; if(state==="play") paused = true; });

function bindBtn(id, key){
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; if(key==="fire" && state!=="play") tryStart(); };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener("pointerdown", on);
  ["pointerup","pointerleave","pointercancel"].forEach(ev => el.addEventListener(ev, off));
  el.addEventListener("contextmenu", e => e.preventDefault());
}
bindBtn("bl","left"); bindBtn("br","right"); bindBtn("fire","fire");
cv.addEventListener("pointerdown", () => { if(state!=="play") tryStart(); else if(paused) paused = false; });

function tryStart(){
  if(state==="over" && overTimer > -1.2) return; // 잠깐 대기 후 재시작
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state==="suspended") ac.resume();
  newGame();
}

/* ---------- 게임 시작/스테이지 ---------- */
function newGame(){
  score = 0; lives = 3; stage = 1; nextLife = 20000;
  player = {x:W/2, y:H-64, cd:0, alive:true, respawn:0, inv:0};
  pb = []; eb = []; parts = [];
  paused = false; cleared = false;
  state = "play";
  sfx.start();
  startStage();
}

function startStage(){
  enemies = []; eb = [];
  const waves = [
    {type:"bee",       row:3, cols:[0,1,2,3,4,5,6,7], side:-1},
    {type:"bee",       row:4, cols:[0,1,2,3,4,5,6,7], side: 1},
    {type:"butterfly", row:1, cols:[0,1,2,3,4,5,6,7], side:-1},
    {type:"butterfly", row:2, cols:[0,1,2,3,4,5,6,7], side: 1},
    {type:"boss",      row:0, cols:[2,3,4,5],          side:-1}
  ];
  waves.forEach((w, wi) => {
    w.cols.forEach((c, i) => {
      enemies.push({
        type:w.type, col:c, row:w.row, hp:w.type==="boss"?2:1,
        state:"wait", delay:1.9 + wi*2.6 + i*0.17, t:0, side:w.side,
        x:-100, y:-100, flash:0, fired:0, ph:0, bx:0
      });
    });
  });
  diveTimer = 2;
  banner = 2; bannerText = "STAGE " + stage;
  cleared = false;
}

const homeX = e => W/2 + (e.col - 3.5)*44 + Math.sin(time*0.9)*28;
const homeY = e => 92 + e.row*36;
const bez = (a,b,c,d,t) => { const u = 1-t; return u*u*u*a + 3*u*u*t*b + 3*u*t*t*c + t*t*t*d; };

function explode(x, y, n, colors){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = rnd(40, 220);
    parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:rnd(0.3,0.8), max:0.8,
                color:colors[(Math.random()*colors.length)|0], s:rnd(2,4)});
  }
}

function addScore(n){
  score += n;
  if(score > hi) hi = score;
  if(score >= nextLife){ lives++; nextLife += 60000; sfx.life(); }
}

function enemyFire(e){
  if(eb.length >= 8 || !player.alive) return;
  const dx = player.x - e.x, dy = player.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  const sp = 200 + stage*9;
  eb.push({x:e.x, y:e.y+10, vx:dx/d*sp, vy:Math.max(80, dy/d*sp)});
  beep(260, 0.08, "square", 0.025, -80);
}

function killPlayer(){
  if(!player.alive) return;
  explode(player.x, player.y, 40, ["#fff","#4eeeff","#ff3b3b","#ffd92a"]);
  sfx.die();
  player.alive = false; lives--; player.respawn = 1.8;
}

/* ---------- 업데이트 ---------- */
function update(dt){
  time += dt;

  for(const s of stars){ s.y += (30 + s.z*120)*dt*(state==="play"?1:0.4); if(s.y > H){ s.y = 0; s.x = Math.random()*W; } }
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt;
    if(p.life <= 0) parts.splice(i,1);
  }
  if(state === "over"){ overTimer -= dt; }
  if(state !== "play" || paused) return;

  if(banner > 0) banner -= dt;

  /* 플레이어 */
  if(player.alive){
    const dx = (keys.right?1:0) - (keys.left?1:0);
    player.x = clamp(player.x + dx*310*dt, 20, W-20);
    player.cd -= dt; player.inv -= dt;
    if(keys.fire && player.cd <= 0 && pb.length < 3){
      pb.push({x:player.x, y:player.y-20}); player.cd = 0.16; sfx.shoot();
    }
  } else {
    player.respawn -= dt;
    if(player.respawn <= 0){
      if(lives > 0){ player.alive = true; player.x = W/2; player.inv = 2.2; eb = []; }
      else { state = "over"; overTimer = 0; try{ localStorage.setItem("starGalaxyHi", hi); }catch(e){} }
    }
  }

  /* 내 총알 */
  for(let i=pb.length-1;i>=0;i--){ pb[i].y -= 540*dt; if(pb[i].y < -10) pb.splice(i,1); }

  /* 적 총알 */
  for(let i=eb.length-1;i>=0;i--){
    const b = eb[i]; b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.y > H+10 || b.x < -10 || b.x > W+10){ eb.splice(i,1); continue; }
    if(player.alive && player.inv <= 0 && Math.abs(b.x-player.x) < 11 && Math.abs(b.y-player.y) < 13){
      eb.splice(i,1); killPlayer();
    }
  }

  /* 급강하 타이머 */
  diveTimer -= dt;
  const pending = enemies.some(e => e.state==="wait" || e.state==="enter");
  if(diveTimer <= 0 && !pending){
    diveTimer = Math.max(0.6, 2.0 - stage*0.12) + Math.random()*0.6;
    const diving = enemies.filter(e => e.state==="dive").length;
    if(diving < Math.min(2 + stage, 7)){
      const c = enemies.filter(e => e.state==="formation");
      if(c.length){
        const e = c[(Math.random()*c.length)|0];
        e.state = "dive"; e.ph = Math.random()*6; e.bx = e.x; e.fired = 0;
        e.fireAt = rnd(120, 260); beep(520, 0.25, "triangle", 0.04, 300);
      }
    }
  }

  /* 적 */
  for(const e of enemies){
    if(e.flash > 0) e.flash -= dt;
    if(e.state === "wait"){
      e.delay -= dt;
      if(e.delay <= 0){ e.state = "enter"; e.t = 0; }
    } else if(e.state === "enter"){
      e.t += dt / 2.6;
      const t = Math.min(e.t, 1), sd = e.side;
      const p0 = sd<0 ? 60 : W-60, p1 = sd<0 ? 30 : W-30, p2 = sd<0 ? W-60 : 60;
      e.x = bez(p0, p1, p2, homeX(e), t);
      e.y = bez(-30, 520, 300, homeY(e), t);
      if(e.t >= 1) e.state = "formation";
    } else if(e.state === "formation"){
      e.x = homeX(e); e.y = homeY(e);
    } else if(e.state === "dive"){
      e.y += (170 + stage*12)*dt;
      e.ph += dt*3.2;
      if(e.y < H-220) e.bx += clamp(player.x - e.bx, -1, 1)*55*dt;
      e.x = e.bx + Math.sin(e.ph)*55;
      if(e.fired < (stage>3?2:1) && e.y > e.fireAt){ enemyFire(e); e.fired++; e.fireAt += 150; }
      if(e.y > H+30){ e.state = "return"; e.y = -30; e.x = homeX(e); }
    } else if(e.state === "return"){
      e.x = homeX(e); e.y += 230*dt;
      if(e.y >= homeY(e)){ e.y = homeY(e); e.state = "formation"; }
    }
  }

  /* 내 총알 vs 적 */
  for(let i=pb.length-1;i>=0;i--){
    const b = pb[i]; let hit = false;
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(e.state === "wait") continue;
      if(Math.abs(b.x-e.x) < 17 && Math.abs(b.y-e.y) < 15){
        hit = true; e.hp--;
        if(e.hp <= 0){
          const diving = e.state==="dive" || e.state==="return";
          const pts = {bee:[50,100], butterfly:[80,160], boss:[150,400]}[e.type][diving?1:0];
          addScore(pts);
          explode(e.x, e.y, 16, e.type==="boss" ? ["#35d46a","#fff","#ffd92a"] : e.type==="bee" ? ["#ffd92a","#fff","#ff9a2a"] : ["#3a9bff","#ff3b3b","#fff"]);
          sfx.boom();
          enemies.splice(j,1);
        } else { e.flash = 0.12; sfx.hit(); }
        break;
      }
    }
    if(hit) pb.splice(i,1);
  }

  /* 적 몸체 vs 플레이어 */
  if(player.alive && player.inv <= 0){
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(e.state!=="dive" && e.state!=="return" && e.state!=="enter") continue;
      if(Math.abs(e.x-player.x) < 22 && Math.abs(e.y-player.y) < 19){
        explode(e.x, e.y, 14, ["#fff","#ffd92a"]); enemies.splice(j,1); killPlayer(); break;
      }
    }
  }

  /* 스테이지 클리어 */
  if(enemies.length === 0 && !cleared && state === "play"){
    cleared = true; stageWait = 2.2; banner = 2.2; bannerText = "STAGE CLEAR!";
  }
  if(cleared){
    stageWait -= dt;
    if(stageWait <= 0){ stage++; startStage(); }
  }
}

/* ---------- 그리기 ---------- */
function draw(){
  ctx.fillStyle = "#000"; ctx.fillRect(0,0,W,H);

  for(const s of stars){
    const a = 0.3 + s.z*0.7;
    ctx.fillStyle = "rgba(255,255,255," + a.toFixed(2) + ")";
    ctx.fillRect(s.x, s.y, s.s, s.s*(1+s.z*2));
  }

  if(state === "title"){ drawTitle(); return; }

  /* 적 */
  for(const e of enemies){
    if(e.state === "wait") continue;
    const over = e.flash > 0 ? {G:"#fff",Y:"#fff",B:"#fff",R:"#fff"} : (e.type==="boss" && e.hp<2 ? {G:"#ee55ee"} : null);
    sprite(SPR[e.type], e.x, e.y, 3, over);
  }

  /* 플레이어 */
  if(player.alive && !(player.inv > 0 && Math.floor(time*20)%2)){
    sprite(SPR.player, player.x, player.y, 3);
    if(keys.fire || true){
      ctx.fillStyle = (Math.floor(time*30)%2) ? "#ffd92a" : "#ff7a2a";
      ctx.fillRect(player.x-2, player.y+15, 4, 5 + (Math.floor(time*30)%2)*3);
    }
  }

  /* 총알 */
  ctx.fillStyle = "#4eeeff";
  for(const b of pb) ctx.fillRect(b.x-2, b.y-8, 4, 14);
  ctx.fillStyle = "#fff";
  for(const b of pb) ctx.fillRect(b.x-1, b.y-8, 2, 6);
  for(const b of eb){
    ctx.fillStyle = "#ff4d4d"; ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd0d0"; ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, 7); ctx.fill();
  }

  /* 파티클 */
  for(const p of parts){
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  drawHUD();

  if(banner > 0 && state==="play"){
    txt(bannerText, W/2, H/2 - 20, 34, "#4eeeff", "center");
    if(!cleared) txt("GET READY", W/2, H/2 + 20, 18, "#fff", "center");
  }
  if(paused){
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H);
    txt("PAUSED", W/2, H/2, 36, "#ffd92a", "center");
    txt("P 키 또는 화면 터치로 계속", W/2, H/2+34, 16, "#fff", "center");
  }
  if(state === "over"){
    ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0,0,W,H);
    txt("GAME OVER", W/2, H/2 - 40, 40, "#ff4d4d", "center");
    txt("SCORE  " + score, W/2, H/2 + 4, 22, "#fff", "center");
    if(score >= hi && score > 0) txt("NEW HIGH SCORE!", W/2, H/2 + 34, 18, "#ffd92a", "center");
    if(overTimer <= -1.2 || true){
      if(Math.floor(time*2)%2) txt("PRESS SPACE / ENTER / TAP", W/2, H/2 + 80, 16, "#4eeeff", "center");
    }
  }
}

function drawHUD(){
  txt("1UP", 14, 22, 16, "#ff4d4d");
  txt(String(score).padStart(6,"0"), 14, 42, 18, "#fff");
  txt("HIGH SCORE", W/2, 22, 16, "#ff4d4d", "center");
  txt(String(hi).padStart(6,"0"), W/2, 42, 18, "#fff", "center");
  const reserve = Math.max(0, player.alive ? lives-1 : lives);
  for(let i=0;i<Math.min(reserve, 8);i++){
    sprite(SPR.player, 24 + i*28, H-18, 2);
  }
  txt("STAGE " + stage, W-14, H-12, 16, "#ffd92a", "right");
  txt("M:소리 P:일시정지", W-14, 22, 11, "#667", "right");
}

function drawTitle(){
  const bob = Math.sin(time*2)*4;
  txt("STAR", W/2, 150+bob, 64, "#4eeeff", "center");
  txt("GALAXY", W/2, 215+bob, 64, "#ff3b8b", "center");
  txt("ARCADE SHOOTER", W/2, 245, 16, "#aab", "center");

  const rows = [["boss","150 / 400"],["butterfly","80 / 160"],["bee","50 / 100"]];
  rows.forEach((r,i) => {
    sprite(SPR[r[0]], W/2-70, 300+i*40, 3);
    txt("= " + r[1] + " PTS", W/2-40, 306+i*40, 16, "#fff");
  });
  txt("(편대 / 급강하 중 점수)", W/2, 410, 12, "#778", "center");

  txt("← → / A D : 이동", W/2, 450, 15, "#cfe", "center");
  txt("SPACE : 발사   P : 일시정지   M : 소리", W/2, 474, 15, "#cfe", "center");

  if(Math.floor(time*2)%2) txt("PRESS SPACE / ENTER / TAP", W/2, 535, 20, "#ffd92a", "center");
  txt("HIGH SCORE  " + String(hi).padStart(6,"0"), W/2, 585, 16, "#ff4d4d", "center");
  sprite(SPR.player, W/2, 620, 2);
}

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
player = {x:W/2, y:H-64, cd:0, alive:true, respawn:0, inv:0};
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
